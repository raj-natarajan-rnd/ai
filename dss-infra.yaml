AWSTemplateFormatVersion: '2010-09-09'
Description: >
  DSS (Data Set Search) - single-node OpenSearch domain in a VPC, with S3-driven
  ingest. Logical IDs are DSS<Name>; physical names are dss-${EnvName}-<what>.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: Environment }
        Parameters: [EnvName, ProjectName, POCName]
      - Label: { default: Network (dropdowns in the CloudFormation console) }
        Parameters: [VpcId, SubnetId, AllowedCidr]
      - Label: { default: Domain }
        Parameters: [EngineVersion, InstanceType, VolumeSize]
      - Label: { default: Access }
        Parameters: [MasterUserName, MasterUserPassword]
    ParameterLabels:
      VpcId:            { default: VPC }
      SubnetId:         { default: Subnet (one — the domain is single-AZ) }

Parameters:

  EnvName:
    Type: String
    Default: poc
    Description: Environment selector. Every resource name and export includes it.
    AllowedPattern: '[a-z0-9]{2,10}'
    ConstraintDescription: 2-10 lowercase alphanumeric characters.

  ProjectName:
    Type: String
    Default: DataArch
    Description: Standard tag applied to every taggable resource and to the stack.

  POCName:
    Type: String
    Default: RajNatarajan
    Description: Standard tag applied to every taggable resource and to the stack.

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC the domain's network interfaces are placed in.

  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: One subnet in the VPC above. The domain is single-AZ.

  AllowedCidr:
    Type: String
    Default: 0.0.0.0/0
    Description: CIDR allowed to reach the domain. The endpoint is private, so this is VPC-internal.
    AllowedPattern: '(\d{1,3}\.){3}\d{1,3}/\d{1,2}'

  EngineVersion:
    Type: String
    Default: OpenSearch_2.17
    Description: "Must be offered in this region. Check with: aws opensearch list-versions"

  InstanceType:
    Type: String
    Default: t3.small.search
    AllowedValues:
      - t3.small.search      # ~$0.036/hr  2 vCPU / 2 GiB  — enough for a few thousand docs
      - t3.medium.search     # ~$0.073/hr  2 vCPU / 4 GiB  — if Tika struggles on large PDFs
      - m6g.large.search     # ~$0.128/hr  the only tier here that supports k-NN vectors
    Description: T-class does not support k-NN; m6g.large.search is the floor if vectors are added.

  VolumeSize:
    Type: Number
    Default: 10
    MinValue: 10
    MaxValue: 100

  IngestCodeKey:
    Type: String
    Default: ''
    Description: Ingest zip key in the code bucket. Leave blank on first deploy; the function starts as a stub.

  MasterUserName:
    Type: String
    Default: dss-admin

  MasterUserPassword:
    Type: String
    NoEcho: true
    MinLength: 8
    Description: Min 8 chars with an uppercase, a lowercase, a digit and a symbol.

Conditions:

  DSSUsePackagedIngest: !Not [ !Equals [ !Ref IngestCodeKey, '' ] ]

Resources:

  DSSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub 'dss-${EnvName}-domain-sg'
      GroupDescription: !Sub 'Access to the dss-${EnvName} OpenSearch domain.'
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        # All protocols; the endpoint is private, so this is VPC-internal.
        - IpProtocol: -1
          CidrIp: !Ref AllowedCidr
          Description: All traffic - POC only (EC2 rejects non-ASCII here).
      Tags:
        - { Key: Name,        Value: !Sub 'dss-${EnvName}-domain-sg' }
        - { Key: ProjectName, Value: !Ref ProjectName }
        - { Key: POCName,     Value: !Ref POCName }
        - { Key: Env,         Value: !Ref EnvName }

  # Source of truth. Uploads under datasets/ trigger ingest.
  DSSDataBucket:
    Type: AWS::S3::Bucket
    DependsOn: DSSIngestPermission
    Properties:
      BucketName: !Sub 'dss-${EnvName}-data-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: 's3:ObjectCreated:*'
            Filter:
              S3Key:
                Rules:
                  - { Name: prefix, Value: 'datasets/' }
                  - { Name: suffix, Value: '.json' }
            Function: !GetAtt DSSIngestLambda.Arn
          - Event: 's3:ObjectCreated:*'
            Filter:
              S3Key:
                Rules:
                  - { Name: prefix, Value: 'datasets/' }
                  - { Name: suffix, Value: '.ndjson' }
            Function: !GetAtt DSSIngestLambda.Arn
      Tags:
        - { Key: ProjectName, Value: !Ref ProjectName }
        - { Key: POCName,     Value: !Ref POCName }
        - { Key: Env,         Value: !Ref EnvName }

  # Basic-auth credentials for the Lambdas.
  # Lambda deployment packages, kept apart from ingest data.
  DSSCodeBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'dss-${EnvName}-code-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - { Key: ProjectName, Value: !Ref ProjectName }
        - { Key: POCName,     Value: !Ref POCName }
        - { Key: Env,         Value: !Ref EnvName }

  DSSIngestSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub 'dss-${EnvName}-master-user'
      Description: !Sub 'Master user credentials for the dss-${EnvName} domain.'
      SecretString: !Sub '{"username":"${MasterUserName}","password":"${MasterUserPassword}"}'
      Tags:
        - { Key: ProjectName, Value: !Ref ProjectName }
        - { Key: POCName,     Value: !Ref POCName }
        - { Key: Env,         Value: !Ref EnvName }

  # S3 invokes asynchronously: without this, failures are discarded after two retries.
  DSSIngestDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub 'dss-${EnvName}-ingest-dlq'
      MessageRetentionPeriod: 1209600
      Tags:
        - { Key: ProjectName, Value: !Ref ProjectName }
        - { Key: POCName,     Value: !Ref POCName }
        - { Key: Env,         Value: !Ref EnvName }

  DSSIngestRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'dss-${EnvName}-ingest-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        # VPC-attached Lambdas must manage their own ENIs.
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole'
      Policies:
        - PolicyName: read-source-and-secret
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:ListBucket]
                Resource:
                  - !Sub 'arn:${AWS::Partition}:s3:::dss-${EnvName}-data-${AWS::AccountId}'
                  - !Sub 'arn:${AWS::Partition}:s3:::dss-${EnvName}-data-${AWS::AccountId}/*'
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref DSSIngestSecret
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt DSSIngestDLQ.Arn
      Tags:
        - { Key: ProjectName, Value: !Ref ProjectName }
        - { Key: POCName,     Value: !Ref POCName }
        - { Key: Env,         Value: !Ref EnvName }

  DSSIngestLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'dss-${EnvName}-ingest'
      Description: S3 ObjectCreated -> parse JSON -> bulk index into OpenSearch.
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt DSSIngestRole.Arn
      Timeout: 120
      MemorySize: 256
      DeadLetterConfig:
        TargetArn: !GetAtt DSSIngestDLQ.Arn
      VpcConfig:
        SubnetIds: [ !Ref SubnetId ]
        SecurityGroupIds: [ !Ref DSSSecurityGroup ]
      Environment:
        Variables:
          ENDPOINT: !Sub 'https://${DSSDomain.DomainEndpoint}'
          INDEX: !Sub 'dss-${EnvName}-datasets'
          SECRET: !Ref DSSIngestSecret
          MAPPING_KEY: config/index-mapping.json
          ENV_NAME: !Ref EnvName
          PREFIX_ROOT: datasets
      Code: !If
        - DSSUsePackagedIngest
        - S3Bucket: !Ref DSSCodeBucket
          S3Key: !Ref IngestCodeKey
        # Stub used until the code bucket exists and IngestCodeKey is set.
        - ZipFile: |
            import json
            def handler(event, context=None):
                print(json.dumps({"stub": True,
                                  "note": "run scripts/package.sh and redeploy"}))
                return {"stub": True}
      Tags:
        - { Key: ProjectName, Value: !Ref ProjectName }
        - { Key: POCName,     Value: !Ref POCName }
        - { Key: Env,         Value: !Ref EnvName }

  # Literal bucket name, not !Ref: breaks the bucket/permission circular dependency.
  # Read path: forwards OpenSearch API calls from outside the VPC.
  DSSQueryLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'dss-${EnvName}-query'
      Description: Forwards OpenSearch API requests from outside the VPC.
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt DSSIngestRole.Arn
      Timeout: 60
      MemorySize: 256
      VpcConfig:
        SubnetIds: [ !Ref SubnetId ]
        SecurityGroupIds: [ !Ref DSSSecurityGroup ]
      Environment:
        Variables:
          ENDPOINT: !Sub 'https://${DSSDomain.DomainEndpoint}'
          INDEX: !Sub 'dss-${EnvName}-datasets'
          SECRET: !Ref DSSIngestSecret
      Code:
        ZipFile: |
          import base64, json, os, urllib.error, urllib.request, boto3
          sm = boto3.client('secretsmanager')
          EP = os.environ['ENDPOINT']; IDX = os.environ['INDEX']; SEC = os.environ['SECRET']
          FIELDS = ['name^3', 'display_name^2', 'description', 'tags', 'columns']
          _c = {}

          def auth():
              if 'h' not in _c:
                  v = json.loads(sm.get_secret_value(SecretId=SEC)['SecretString'])
                  t = f"{v['username']}:{v['password']}".encode()
                  _c['h'] = 'Basic ' + base64.b64encode(t).decode()
              return _c['h']

          def handler(event, context=None):
              # {"q": "..."} is shorthand for a search; otherwise pass path/method/body
              # and this forwards any OpenSearch API call verbatim.
              method = (event.get('method') or 'GET').upper()
              path = event.get('path') or ('/' + IDX + '/_search')
              body = event.get('body')
              if event.get('q') and body is None:
                  body = {'size': event.get('size', 5),
                          'query': {'multi_match': {'query': event['q'], 'fields': FIELDS,
                                                    'fuzziness': event.get('fuzziness', 'AUTO')}},
                          'highlight': {'fields': {'description': {}}}}
                  method = 'POST'
              if not path.startswith('/'):
                  path = '/' + path
              data = json.dumps(body).encode('utf-8') if body is not None else None
              r = urllib.request.Request(EP + path, data=data, method=method,
                    headers={'Content-Type': 'application/json', 'Authorization': auth()})
              try:
                  with urllib.request.urlopen(r, timeout=45) as x:
                      raw, code = x.read().decode('utf-8'), x.status
              except urllib.error.HTTPError as e:
                  raw, code = e.read().decode('utf-8', 'replace'), e.code
              try:
                  parsed = json.loads(raw)
              except Exception:
                  parsed = raw
              return {'status': code, 'path': path, 'body': parsed}
      Tags:
        - { Key: ProjectName, Value: !Ref ProjectName }
        - { Key: POCName,     Value: !Ref POCName }
        - { Key: Env,         Value: !Ref EnvName }

  DSSIngestPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt DSSIngestLambda.Arn
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub 'arn:${AWS::Partition}:s3:::dss-${EnvName}-data-${AWS::AccountId}'

  DSSDomain:
    Type: AWS::OpenSearchService::Domain
    Properties:
      DomainName: !Sub 'dss-${EnvName}'
      EngineVersion: !Ref EngineVersion

      VPCOptions:
        SubnetIds: [ !Ref SubnetId ]
        SecurityGroupIds: [ !Ref DSSSecurityGroup ]

      ClusterConfig:
        InstanceType: !Ref InstanceType
        InstanceCount: 1
        DedicatedMasterEnabled: false
        ZoneAwarenessEnabled: false

      EBSOptions:
        EBSEnabled: true
        VolumeType: gp3
        VolumeSize: !Ref VolumeSize

      EncryptionAtRestOptions:
        Enabled: true
      NodeToNodeEncryptionOptions:
        Enabled: true
      DomainEndpointOptions:
        EnforceHTTPS: true
        TLSSecurityPolicy: Policy-Min-TLS-1-2-2019-07

      # Fine-grained access control enables HTTP basic auth.
      AdvancedSecurityOptions:
        Enabled: true
        InternalUserDatabaseEnabled: true
        MasterUserOptions:
          MasterUserName: !Ref MasterUserName
          MasterUserPassword: !Ref MasterUserPassword

      # Network access is the security group's job; authentication is the master user.
      AccessPolicies:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { AWS: '*' }
            Action: 'es:*'
            Resource: !Sub 'arn:${AWS::Partition}:es:${AWS::Region}:${AWS::AccountId}:domain/dss-${EnvName}/*'

      Tags:
        - { Key: ProjectName, Value: !Ref ProjectName }
        - { Key: POCName,     Value: !Ref POCName }
        - { Key: Env,         Value: !Ref EnvName }

Outputs:

  DomainEndpoint:
    Description: HTTPS endpoint for the OpenSearch API. Resolves to private addresses only.
    Value: !Sub 'https://${DSSDomain.DomainEndpoint}'
    Export:
      Name: !Sub 'dss-${EnvName}-endpoint'

  DashboardsUrl:
    Description: Dashboards. Reachable only from inside the VPC or through a tunnel.
    Value: !Sub 'https://${DSSDomain.DomainEndpoint}/_dashboards/'
    Export:
      Name: !Sub 'dss-${EnvName}-dashboards-url'

  DomainName:
    Description: OpenSearch domain name.
    Value: !Sub 'dss-${EnvName}'
    Export:
      Name: !Sub 'dss-${EnvName}-domain-name'

  DomainArn:
    Description: OpenSearch domain ARN.
    Value: !GetAtt DSSDomain.Arn
    Export:
      Name: !Sub 'dss-${EnvName}-domain-arn'

  VpcId:
    Description: VPC the domain was placed in.
    Value: !Ref VpcId
    Export:
      Name: !Sub 'dss-${EnvName}-vpc-id'

  SubnetId:
    Description: Subnet holding the domain's network interface.
    Value: !Ref SubnetId
    Export:
      Name: !Sub 'dss-${EnvName}-subnet-id'

  SecurityGroupId:
    Description: Security group guarding the domain.
    Value: !Ref DSSSecurityGroup
    Export:
      Name: !Sub 'dss-${EnvName}-security-group-id'

  DataBucket:
    Description: Bucket holding the JSON to be indexed. Put files under datasets/.
    Value: !Ref DSSDataBucket
    Export:
      Name: !Sub 'dss-${EnvName}-data-bucket'

  IngestFunction:
    Description: Lambda that indexes JSON landing under datasets/ in the data bucket.
    Value: !Ref DSSIngestLambda
    Export:
      Name: !Sub 'dss-${EnvName}-ingest-function'

  IngestDLQ:
    Description: Failed ingest events land here after Lambda's two retries.
    Value: !Ref DSSIngestDLQ
    Export:
      Name: !Sub 'dss-${EnvName}-ingest-dlq'

  QueryFunction:
    Description: Lambda that forwards OpenSearch API calls from outside the VPC.
    Value: !Ref DSSQueryLambda
    Export:
      Name: !Sub 'dss-${EnvName}-query-function'

  CodeBucket:
    Description: Bucket holding the packaged ingest Lambda. Upload the zip here.
    Value: !Ref DSSCodeBucket
    Export:
      Name: !Sub 'dss-${EnvName}-code-bucket'

  DatasetsIndex:
    Description: Index name for the structured dataset records.
    Value: !Sub 'dss-${EnvName}-datasets'
    Export:
      Name: !Sub 'dss-${EnvName}-datasets-index'

  DocsIndex:
    Description: Index name for extracted document text.
    Value: !Sub 'dss-${EnvName}-docs'
    Export:
      Name: !Sub 'dss-${EnvName}-docs-index'
